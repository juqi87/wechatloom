name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/wechatloom

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check dependency license policy
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check ./...
          --ignore github.com/wechatloom/wechatloom
          --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Generate CycloneDX SBOM
        run: >-
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          mod -json -output bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: wechatloom-sbom
          path: bom.json

  visual-smoke:
    name: Pinned browser visual smoke
    runs-on: ubuntu-latest
    env:
      CHROME_FOR_TESTING_VERSION: "150.0.7871.187"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install pinned Chrome Headless Shell for Testing
        run: |
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output chrome-headless-shell.zip
          unzip -q chrome-headless-shell.zip
          echo "WECHATLOOM_BROWSER=$PWD/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Allow the Chrome sandbox on the hosted runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build component gallery and capture mobile viewports
        run: |
          go build -o wechatloom ./cmd/wechatloom
          project_root="$RUNNER_TEMP/wechatloom-visual"
          ./wechatloom init "$project_root"
          build_json="$(./wechatloom build testdata/component-gallery.md --root "$project_root" --theme tech-cyan --json)"
          build_path="$(printf '%s' "$build_json" | jq -r '.data.build_path')"
          ./wechatloom snapshot "$build_path" --output visual-actual --json
      - uses: actions/upload-artifact@v4
        with:
          name: wechatloom-visual-actual-linux-chrome-150
          path: visual-actual/*.png
