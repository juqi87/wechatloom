name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Test release candidate
        run: go test -race ./...
      - name: Install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@v0
      - name: Release signed-checksum artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate updater manifest
        run: ./scripts/generate-update-manifest.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" dist/update-manifest.json
      - name: Attach updater manifest
        run: gh release upload "$GITHUB_REF_NAME" dist/update-manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
